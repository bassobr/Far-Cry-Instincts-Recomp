name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Releases hold the recompiler and the semantics test only. Never the game, its recompiled code
  # (generated/), FarCryInstincts.exe or anything else built from or extracted from default.xbe:
  # there are no game files here, and tools/package.ps1 refuses them.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $V" >&2; exit 1
          fi
      - name: Build fci-recomp and fci-semtest
        shell: cmd
        run: build.bat tools
      - name: Semantics test
        run: out\build\tools\fci-semtest.exe
      - name: Package
        run: tools\package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-zip
          path: |
            out/dist/*.zip
            out/dist/SHA256SUMS
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools-zip
      - name: Check the package
        run: |
          sha256sum -c SHA256SUMS
          unzip -Z1 far-cry-instincts-recomp-tools-*.zip
          if unzip -Z1 far-cry-instincts-recomp-tools-*.zip | grep -iE 'FarCryInstincts\.exe|generated/|assets/|\.(xbe|iso|xiso|profdata|hlsl|dds|png|pak)$'; then
            echo "game files or files derived from the game in the package" >&2; exit 1
          fi
      # Keyless build provenance (Sigstore): gh attestation verify <zip> -R bassobr/Far-Cry-Instincts-Recomp
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: far-cry-instincts-recomp-tools-*.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" far-cry-instincts-recomp-tools-*.zip SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
